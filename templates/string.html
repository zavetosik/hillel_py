<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <title>String Length</title>
</head>

<body>

    <h2>
        Привіт, {{ name }}!
    </h2>

    <p>
        Ви передали стрічку:
    </p>

    <blockquote>
        {{ content }}
    </blockquote>

    <p>
        Довжина стрічки складає
        <strong>{{ length }}</strong>
        символів.
    </p>

</body>
</html>
